<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Work Calendar</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css">
	<link rel="stylesheet" href="/css/calendar.css?v=5">
	<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>
</head>
<body>
<header class="main-header">
	<div class="header-logo">Work Calendar</div>
	<div class="user-profile">
		<span class="user-name" sec:authentication="principal.name">홍길동</span> 님
		<form th:action="@{/logout}" method="post" class="logout-form">
			<button type="submit" class="btn-logout">로그아웃</button>
		</form>
	</div>
</header>
<main class="calendar-page">
	<section class="calendar-shell" aria-label="업무 기록 캘린더">
		<div id="calendar"></div>
	</section>
</main>

<div class="modal-backdrop" id="workLogModal" aria-hidden="true">
	<section class="work-log-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
		<form id="workLogForm">
			<header class="modal-header">
				<h2 id="modalTitle">업무 기록</h2>
				<button class="icon-button" id="modalCloseButton" type="button" aria-label="닫기">×</button>
			</header>

			<div class="modal-body">
				<label class="field" id="workLogIncompleteField">
					<span>진행 중인 업무 불러오기</span>
					<select id="workLogIncompleteList">
						<option value="">-- 직접 입력 또는 업무 선택 --</option>
					</select>
				</label>

				<label class="field">
					<span>제목</span>
					<input id="workLogTitle" name="title" type="text" required autocomplete="off">
				</label>

				<label class="field">
					<span>내용</span>
					<textarea id="workLogContent" name="content" rows="4"></textarea>
				</label>

				<div class="field-grid">
					<label class="field">
						<span>시작</span>
						<input id="workLogStart" name="start" type="datetime-local" required>
					</label>

					<label class="field">
						<span>종료</span>
						<input id="workLogEnd" name="end" type="datetime-local" required>
					</label>
				</div>

				<div class="field-grid">
					<label class="field">
						<span>프로젝트명</span>
						<input id="workLogProjectName" name="projectName" type="text" autocomplete="off" placeholder="예: 비에스">
					</label>

					<label class="field">
						<span>업무 분류</span>
						<select id="workLogCategory" name="category">
							<option value="개발">개발</option>
							<option value="지원">지원</option>
							<option value="유지보수">유지보수</option>
							<option value="일반업무">일반업무</option>
							<option value="공유">공유</option>
							<option value="회의">회의</option>
							<option value="문서">문서</option>
							<option value="기타">기타</option>
						</select>
					</label>

					<label class="field">
						<span>상태</span>
						<select id="workLogStatus" name="status">
							<option value="계획">계획</option>
							<option value="진행중">진행중</option>
							<option value="완료">완료</option>
							<option value="보류">보류</option>
						</select>
					</label>
				</div>

				<div class="field progress-field-container">
					<span>진척률</span>
					<div class="progress-input-group">
						<input id="workLogProgressRate" name="progressRate" type="number" min="0" max="100" placeholder="선택 안 함" autocomplete="off">
						<span class="unit">%</span>
						<input id="workLogProgressSlider" type="range" min="0" max="100" step="1" value="0">
					</div>
					<div class="progress-quick-buttons">
						<button type="button" class="quick-btn" data-value="25">25%</button>
						<button type="button" class="quick-btn" data-value="50">50%</button>
						<button type="button" class="quick-btn" data-value="75">75%</button>
						<button type="button" class="quick-btn" data-value="100">100%</button>
						<button type="button" class="quick-btn action-add" data-add="10">+10%</button>
					</div>
				</div>

				<label class="field">
					<span>보고서 표기 방식</span>
					<select id="workLogReportDisplayType" name="reportDisplayType">
						<option value="PROGRESS">진척률</option>
						<option value="VISIT_DATE">방문일</option>
						<option value="DONE_STATUS">완료상태</option>
						<option value="DUE_DATE">기간</option>
						<option value="NONE">표기없음</option>
					</select>
				</label>

				<label class="checkbox-field">
					<input id="workLogAllDay" name="allDay" type="checkbox">
					<span>종일</span>
				</label>

				<label class="checkbox-field">
					<input id="workLogReportIncluded" name="reportIncluded" type="checkbox" checked>
					<span>주간보고서 포함</span>
				</label>
			</div>

			<footer class="modal-footer">
				<button class="delete-button" id="deleteButton" type="button">삭제</button>
				<div class="modal-actions">
					<button class="secondary-button" id="cancelButton" type="button">취소</button>
					<button class="primary-button" type="submit">저장</button>
				</div>
			</footer>
		</form>
	</section>
</div>

<script>
	document.addEventListener('DOMContentLoaded', function () {
		const calendarElement = document.getElementById('calendar');
		const modalElement = document.getElementById('workLogModal');
		const formElement = document.getElementById('workLogForm');
		const modalTitleElement = document.getElementById('modalTitle');
		const closeButton = document.getElementById('modalCloseButton');
		const cancelButton = document.getElementById('cancelButton');
		const deleteButton = document.getElementById('deleteButton');
		const titleInput = document.getElementById('workLogTitle');
		const contentInput = document.getElementById('workLogContent');
		const startInput = document.getElementById('workLogStart');
		const endInput = document.getElementById('workLogEnd');
		const projectNameInput = document.getElementById('workLogProjectName');
		const categoryInput = document.getElementById('workLogCategory');
		const statusInput = document.getElementById('workLogStatus');
		const progressRateInput = document.getElementById('workLogProgressRate');
		const reportDisplayTypeInput = document.getElementById('workLogReportDisplayType');
		const allDayInput = document.getElementById('workLogAllDay');
		const reportIncludedInput = document.getElementById('workLogReportIncluded');
		const incompleteListSelect = document.getElementById('workLogIncompleteList');
		const incompleteField = document.getElementById('workLogIncompleteField');
		const progressSlider = document.getElementById('workLogProgressSlider');
		let selectedEvent = null;

		const calendar = new FullCalendar.Calendar(calendarElement, {
			initialView: 'dayGridMonth',
			locale: 'ko',
			dayCellContent: function(info) {
				return info.date.getDate();
			},
			fixedWeekCount: false,
			height: '100%',
			nowIndicator: true,
			editable: true,
			selectable: true,
			dayMaxEvents: true,
			allDaySlot: true,
			headerToolbar: {
				left: 'prev,next today weeklyReport',
				center: 'title',
				right: 'dayGridMonth,timeGridWeek,timeGridDay'
			},
			customButtons: {
				weeklyReport: {
					text: '주간보고서',
					click: function () {
						window.location.href = '/reports/weekly';
					}
				}
			},
			buttonText: {
				today: '오늘',
				month: '월',
				week: '주',
				day: '일'
			},
			events: function (info, successCallback, failureCallback) {
				fetch(`/api/work-logs?start=${toDateTimeLocalValue(info.start)}&end=${toDateTimeLocalValue(info.end)}`)
					.then(function (response) {
						if (!response.ok) {
							throw new Error('업무 기록 조회에 실패했습니다.');
						}

						return response.json();
					})
					.then(function (workLogs) {
						successCallback(workLogs.map(toCalendarEvent));
					})
					.catch(failureCallback);
			},
			select: function (info) {
				openCreateModal(info);
			},
			eventClick: function (info) {
				openEditModal(info.event);
			},
			eventDrop: function (info) {
				updateWorkLogTime(info.event, info.revert);
			},
			eventResize: function (info) {
				updateWorkLogTime(info.event, info.revert);
			}
		});

		calendar.render();

		// 마우스 휠 스크롤로 이전달/다음달 이동 (월 뷰이고 모달이 닫혀 있을 때만)
		calendarElement.addEventListener('wheel', function (event) {
			if (modalElement.classList.contains('is-open') || calendar.view.type !== 'dayGridMonth') {
				return;
			}
			event.preventDefault();
			if (event.deltaY > 0) {
				calendar.next();
			} else if (event.deltaY < 0) {
				calendar.prev();
			}
		}, { passive: false });

		formElement.addEventListener('submit', function (event) {
			event.preventDefault();
			saveWorkLog();
		});

		statusInput.addEventListener('change', updateProgressRateState);
		closeButton.addEventListener('click', closeModal);
		cancelButton.addEventListener('click', closeModal);

		deleteButton.addEventListener('click', function () {
			if (!selectedEvent) {
				closeModal();
				return;
			}

			if (confirm('이 업무 기록을 삭제하시겠습니까?')) {
				fetch(`/api/work-logs/${selectedEvent.id}`, {
					method: 'DELETE'
				}).then(function (response) {
					if (!response.ok) {
						throw new Error('삭제에 실패했습니다.');
					}

					selectedEvent.remove();
					closeModal();
				}).catch(function (error) {
					console.error(error);
					alert('삭제 처리 중 오류가 발생했습니다.');
				});
			}
		});

		modalElement.addEventListener('click', function (event) {
			if (event.target === modalElement) {
				closeModal();
			}
		});

		document.addEventListener('keydown', function (event) {
			if (event.key === 'Escape' && modalElement.classList.contains('is-open')) {
				closeModal();
			}
		});

		function openCreateModal(info) {
			selectedEvent = null;
			modalTitleElement.textContent = '업무 기록 등록';
			deleteButton.hidden = true;
			formElement.reset();
			
			let startDate = new Date(info.start);
			let endDate = info.end ? new Date(info.end) : new Date(info.start);
			
			if (startDate.getHours() === 0 && startDate.getMinutes() === 0) {
				startDate.setHours(9, 0, 0);
				if (!info.end || (endDate.getTime() - startDate.getTime() <= 24*60*60*1000)) {
					endDate = new Date(startDate);
					endDate.setHours(18, 0, 0);
				} else {
					endDate.setHours(18, 0, 0);
				}
			}
			
			startInput.value = toDateTimeLocalValue(startDate);
			endInput.value = toDateTimeLocalValue(endDate);
			allDayInput.checked = false;
			reportIncludedInput.checked = true;
			updateProgressRateState();

			incompleteField.style.display = 'block';
			loadIncompleteWorkLogs();

			openModal();
		}

		function openEditModal(event) {
			selectedEvent = event;
			modalTitleElement.textContent = '업무 기록 수정';
			deleteButton.hidden = false;
			titleInput.value = event.title;
			contentInput.value = event.extendedProps.content || '';
			startInput.value = toDateTimeLocalValue(event.start);
			endInput.value = toDateTimeLocalValue(event.end || event.start);
			projectNameInput.value = event.extendedProps.projectName || '';
			categoryInput.value = event.extendedProps.category || '기타';
			statusInput.value = event.extendedProps.status || '계획';
			progressRateInput.value = event.extendedProps.progressRate ?? '';
			reportDisplayTypeInput.value = event.extendedProps.reportDisplayType || 'PROGRESS';
			allDayInput.checked = event.allDay;
			reportIncludedInput.checked = event.extendedProps.reportIncluded !== false;
			progressSlider.value = event.extendedProps.progressRate ?? 0;
			updateProgressRateState();

			incompleteField.style.display = 'none';

			openModal();
		}

		function saveWorkLog() {
			const workLog = {
				title: titleInput.value.trim(),
				start: startInput.value,
				end: endInput.value,
				allDay: allDayInput.checked,
				content: contentInput.value.trim(),
				projectName: projectNameInput.value.trim(),
				category: categoryInput.value,
				status: statusInput.value,
				progressRate: progressRateInput.value ? Number(progressRateInput.value) : null,
				reportDisplayType: reportDisplayTypeInput.value,
				reportIncluded: reportIncludedInput.checked
			};

			if (!workLog.title) {
				titleInput.focus();
				return;
			}

			const method = selectedEvent ? 'PUT' : 'POST';
			const url = selectedEvent ? `/api/work-logs/${selectedEvent.id}` : '/api/work-logs';

			fetch(url, {
				method: method,
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(workLog)
			}).then(function (response) {
				if (!response.ok) {
					throw new Error('저장에 실패했습니다.');
				}

				calendar.refetchEvents();
				calendar.unselect();
				closeModal();
			}).catch(function (error) {
				console.error(error);
				alert('저장 처리 중 오류가 발생했습니다.');
			});
		}

		function updateWorkLogTime(event, revert) {
			fetch(`/api/work-logs/${event.id}/time`, {
				method: 'PATCH',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({
					start: toDateTimeLocalValue(event.start),
					end: toDateTimeLocalValue(event.end || event.start),
					allDay: event.allDay
				})
			}).then(function (response) {
				if (!response.ok) {
					revert();
				}
			}).catch(revert);
		}

		function updateProgressRateState() {
			const progressEnabled = statusInput.value === '진행중';
			progressRateInput.disabled = !progressEnabled;
			progressSlider.disabled = !progressEnabled;

			if (!progressEnabled) {
				progressRateInput.value = '';
				progressSlider.value = 0;
			}
		}

		function toCalendarEvent(workLog) {
			return {
				id: String(workLog.id),
				title: workLog.title,
				start: workLog.start,
				end: workLog.end,
				allDay: workLog.allDay,
				extendedProps: {
					content: workLog.content,
					projectName: workLog.projectName,
					category: workLog.category,
					status: workLog.status,
					progressRate: workLog.progressRate,
					reportDisplayType: workLog.reportDisplayType,
					reportIncluded: workLog.reportIncluded
				}
			};
		}

		function openModal() {
			modalElement.classList.add('is-open');
			modalElement.setAttribute('aria-hidden', 'false');
			titleInput.focus();
		}

		function closeModal() {
			modalElement.classList.remove('is-open');
			modalElement.setAttribute('aria-hidden', 'true');
			selectedEvent = null;
			calendar.unselect();
		}

		incompleteListSelect.addEventListener('change', function() {
			const selectedOption = this.options[this.selectedIndex];
			if (!selectedOption.value) {
				return;
			}
			
			titleInput.value = selectedOption.dataset.title || '';
			projectNameInput.value = selectedOption.dataset.projectName || '';
			categoryInput.value = selectedOption.dataset.category || '기타';
			statusInput.value = selectedOption.dataset.status || '계획';
			progressRateInput.value = selectedOption.dataset.progressRate || '';
			progressSlider.value = selectedOption.dataset.progressRate || 0;
			contentInput.value = selectedOption.dataset.content || '';
			reportDisplayTypeInput.value = selectedOption.dataset.reportDisplayType || 'PROGRESS';
			reportIncludedInput.checked = selectedOption.dataset.reportIncluded === 'true';
			
			updateProgressRateState();
		});

		progressRateInput.addEventListener('input', function() {
			let val = parseInt(this.value);
			if (isNaN(val)) val = 0;
			if (val < 0) val = 0;
			if (val > 100) val = 100;
			progressSlider.value = val;
		});

		progressSlider.addEventListener('input', function() {
			progressRateInput.value = this.value;
		});

		document.querySelectorAll('.progress-quick-buttons .quick-btn').forEach(function(btn) {
			btn.addEventListener('click', function() {
				if (progressRateInput.disabled) return;
				
				if (this.dataset.value) {
					progressRateInput.value = this.dataset.value;
					progressSlider.value = this.dataset.value;
				} else if (this.dataset.add) {
					let currentVal = parseInt(progressRateInput.value);
					if (isNaN(currentVal)) currentVal = 0;
					let newVal = currentVal + parseInt(this.dataset.add);
					if (newVal > 100) newVal = 100;
					progressRateInput.value = newVal;
					progressSlider.value = newVal;
				}
			});
		});

		function loadIncompleteWorkLogs() {
			fetch('/api/work-logs/incomplete')
				.then(function (response) {
					if (!response.ok) {
						throw new Error('미완료 업무 조회 실패');
					}
					return response.json();
				})
				.then(function (data) {
					incompleteListSelect.innerHTML = '<option value="">-- 직접 입력 또는 업무 선택 --</option>';
					
					const uniqueLogs = new Map();
					data.forEach(function (log) {
						const key = `${log.title} | ${log.projectName || ''}`;
						if (!uniqueLogs.has(key)) {
							uniqueLogs.set(key, log);
						}
					});

					uniqueLogs.forEach(function (log) {
						const option = document.createElement('option');
						option.value = log.id;
						const progressText = log.progressRate !== null ? ` (${log.progressRate}%)` : '';
						option.textContent = `[${log.projectName || '공통'}] ${log.title}${progressText}`;
						
						option.dataset.title = log.title;
						option.dataset.projectName = log.projectName || '';
						option.dataset.category = log.category || '기타';
						option.dataset.status = log.status || '계획';
						option.dataset.progressRate = log.progressRate ?? '';
						option.dataset.content = log.content || '';
						option.dataset.reportDisplayType = log.reportDisplayType || 'PROGRESS';
						option.dataset.reportIncluded = log.reportIncluded;
						
						incompleteListSelect.appendChild(option);
					});
				})
				.catch(function (error) {
					console.error('미완료 업무 조회 에러:', error);
				});
		}

		function toDateTimeLocalValue(date) {
			const year = date.getFullYear();
			const month = String(date.getMonth() + 1).padStart(2, '0');
			const day = String(date.getDate()).padStart(2, '0');
			const hour = String(date.getHours()).padStart(2, '0');
			const minute = String(date.getMinutes()).padStart(2, '0');

			return `${year}-${month}-${day}T${hour}:${minute}`;
		}
	});
</script>

<!-- 무서운 깜짝 모달 (Jumpscare) -->
<div id="scaryJumpscareOverlay" class="scary-overlay" aria-hidden="true">
	<div class="scary-content">
		<img src="/images/scary.png" alt="Scary Ghost" class="scary-image">
	</div>
</div>
<button id="scaryJumpscareBtn" class="scary-button" type="button" aria-label="도움말">?</button>

<style>
	/* 반짝반짝 효과 물음표 버튼 */
	.scary-button {
		position: fixed;
		bottom: 20px;
		right: 20px;
		width: 42px;
		height: 42px;
		border-radius: 50%;
		background: radial-gradient(circle, #ff3333 0%, #660000 100%);
		border: 2px solid #ff9999;
		color: #ffffff;
		font-size: 22px;
		font-weight: 900;
		font-family: 'Outfit', sans-serif;
		cursor: pointer;
		display: flex;
		align-items: center;
		justify-content: center;
		box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, inset 0 0 8px #ff3333;
		z-index: 9999;
		transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
		animation: scary-blink 1.5s infinite alternate;
	}

	.scary-button:hover {
		transform: scale(1.2) rotate(15deg);
		background: radial-gradient(circle, #ff0000 0%, #990000 100%);
		border-color: #ffcccc;
		box-shadow: 0 0 25px #ff0000, 0 0 50px #ff0000, inset 0 0 15px #ff6666;
		animation: crazy-vibrate 0.05s infinite;
	}

	@keyframes scary-blink {
		0% {
			box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, inset 0 0 5px #ff3333;
			opacity: 0.9;
			transform: scale(1);
		}
		50% {
			opacity: 1;
		}
		100% {
			box-shadow: 0 0 25px #ff3333, 0 0 45px #ff0000, 0 0 60px #ff0000, inset 0 0 15px #ff6666;
			opacity: 0.95;
			transform: scale(1.08);
		}
	}

	@keyframes crazy-vibrate {
		0% { transform: scale(1.2) translate(0, 0) rotate(15deg); }
		25% { transform: scale(1.2) translate(-2px, 2px) rotate(13deg); }
		50% { transform: scale(1.2) translate(2px, -2px) rotate(17deg); }
		75% { transform: scale(1.2) translate(-2px, -2px) rotate(14deg); }
		100% { transform: scale(1.2) translate(2px, 2px) rotate(16deg); }
	}

	/* 무서운 오버레이 화면 */
	.scary-overlay {
		display: none;
		position: fixed;
		top: 0;
		left: 0;
		width: 100vw;
		height: 100vh;
		background-color: rgba(0, 0, 0, 0.95);
		z-index: 100000;
		justify-content: center;
		align-items: center;
		overflow: hidden;
		backdrop-filter: blur(15px);
		animation: red-flash 0.2s infinite alternate;
	}

	.scary-overlay.active {
		display: flex;
	}

	.scary-content {
		position: relative;
		width: 100%;
		height: 100%;
		display: flex;
		justify-content: center;
		align-items: center;
	}

	.scary-image {
		max-width: 90%;
		max-height: 90%;
		object-fit: contain;
		transform: scale(0.1);
		opacity: 0;
		transition: transform 0.15s cubic-bezier(0.6, -0.28, 0.735, 0.045), opacity 0.1s ease-out;
	}

	.scary-overlay.active .scary-image {
		transform: scale(1.8);
		opacity: 1;
		animation: image-shake 0.05s infinite, image-zoom 2.5s forwards;
	}

	/* 화면 전체 흔들림 (지진 효과) */
	.earthquake {
		animation: screen-shake 0.08s infinite;
		overflow: hidden;
	}

	@keyframes red-flash {
		0% { background-color: rgba(0, 0, 0, 0.96); }
		100% { background-color: rgba(40, 0, 0, 0.98); }
	}

	@keyframes screen-shake {
		0% { transform: translate(0, 0) rotate(0deg); }
		20% { transform: translate(-8px, 10px) rotate(-1deg); }
		40% { transform: translate(9px, -9px) rotate(1deg); }
		60% { transform: translate(-10px, -7px) rotate(-1.5deg); }
		80% { transform: translate(8px, 8px) rotate(1deg); }
		100% { transform: translate(0, 0) rotate(0deg); }
	}

	@keyframes image-shake {
		0% { transform: scale(1.8) translate(0, 0); }
		25% { transform: scale(1.82) translate(-5px, 5px); }
		50% { transform: scale(1.78) translate(5px, -5px); }
		75% { transform: scale(1.83) translate(-5px, -5px); }
		100% { transform: scale(1.8) translate(5px, 5px); }
	}

	@keyframes image-zoom {
		0% { transform: scale(1.5); }
		100% { transform: scale(2.5); }
	}
</style>

<script>
	document.addEventListener('DOMContentLoaded', function() {
		const scaryBtn = document.getElementById('scaryJumpscareBtn');
		const scaryOverlay = document.getElementById('scaryJumpscareOverlay');
		let scaryAudioCtx = null;

		function playTerrorSound() {
			try {
				if (!scaryAudioCtx) {
					scaryAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
				}
				if (scaryAudioCtx.state === 'suspended') {
					scaryAudioCtx.resume();
				}

				const duration = 2.5;
				const dest = scaryAudioCtx.destination;

				// 1. 디스토션 노드 생성
				const distortion = scaryAudioCtx.createWaveShaper();
				distortion.curve = (function(amount) {
					const k = typeof amount === 'number' ? amount : 50;
					const n_samples = 44100;
					const curve = new Float32Array(n_samples);
					const deg = Math.PI / 180;
					for (let i = 0; i < n_samples; ++i) {
						const x = (i * 2) / n_samples - 1;
						curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
					}
					return curve;
				})(100);

				// 2. 게인 노드 (볼륨 페이드 아웃)
				const gainNode = scaryAudioCtx.createGain();
				gainNode.gain.setValueAtTime(0.01, scaryAudioCtx.currentTime);
				gainNode.gain.exponentialRampToValueAtTime(1.0, scaryAudioCtx.currentTime + 0.05);
				gainNode.gain.exponentialRampToValueAtTime(0.8, scaryAudioCtx.currentTime + 0.5);
				gainNode.gain.exponentialRampToValueAtTime(0.01, scaryAudioCtx.currentTime + duration - 0.1);

				// 3. 필터 노드 (기괴한 울림)
				const filter = scaryAudioCtx.createBiquadFilter();
				filter.type = 'peaking';
				filter.frequency.setValueAtTime(1000, scaryAudioCtx.currentTime);
				filter.Q.setValueAtTime(10, scaryAudioCtx.currentTime);

				// 4. 발진기 3개 (불협화음)
				const osc1 = scaryAudioCtx.createOscillator();
				osc1.type = 'sawtooth';
				osc1.frequency.setValueAtTime(180, scaryAudioCtx.currentTime);
				osc1.frequency.exponentialRampToValueAtTime(800, scaryAudioCtx.currentTime + 0.2);
				osc1.frequency.linearRampToValueAtTime(150, scaryAudioCtx.currentTime + duration);

				const osc2 = scaryAudioCtx.createOscillator();
				osc2.type = 'square';
				osc2.frequency.setValueAtTime(185, scaryAudioCtx.currentTime);
				osc2.frequency.exponentialRampToValueAtTime(850, scaryAudioCtx.currentTime + 0.25);
				osc2.frequency.linearRampToValueAtTime(90, scaryAudioCtx.currentTime + duration);

				const osc3 = scaryAudioCtx.createOscillator();
				osc3.type = 'triangle';
				osc3.frequency.setValueAtTime(90, scaryAudioCtx.currentTime);
				osc3.frequency.exponentialRampToValueAtTime(1200, scaryAudioCtx.currentTime + 0.1);
				osc3.frequency.linearRampToValueAtTime(40, scaryAudioCtx.currentTime + duration);

				// 5. 노이즈 소스 (귀를 긁는 소리)
				const bufferSize = scaryAudioCtx.sampleRate * duration;
				const buffer = scaryAudioCtx.createBuffer(1, bufferSize, scaryAudioCtx.sampleRate);
				const data = buffer.getChannelData(0);
				for (let i = 0; i < bufferSize; i++) {
					data[i] = Math.random() * 2 - 1;
				}
				const noise = scaryAudioCtx.createBufferSource();
				noise.buffer = buffer;

				const noiseFilter = scaryAudioCtx.createBiquadFilter();
				noiseFilter.type = 'bandpass';
				noiseFilter.frequency.setValueAtTime(1500, scaryAudioCtx.currentTime);
				noiseFilter.Q.setValueAtTime(2.0, scaryAudioCtx.currentTime);

				// 연결
				osc1.connect(distortion);
				osc2.connect(distortion);
				osc3.connect(distortion);
				distortion.connect(filter);
				filter.connect(gainNode);

				noise.connect(noiseFilter);
				noiseFilter.connect(gainNode);

				gainNode.connect(dest);

				// 재생 시작
				const now = scaryAudioCtx.currentTime;
				osc1.start(now);
				osc2.start(now);
				osc3.start(now);
				noise.start(now);

				// 정지
				osc1.stop(now + duration);
				osc2.stop(now + duration);
				osc3.stop(now + duration);
				noise.stop(now + duration);

			} catch (err) {
				console.error('사운드 생성 실패:', err);
			}
		}

		let jumpscareTimeout = null;

		function triggerJumpscare() {
			if (scaryOverlay.classList.contains('active')) return;

			playTerrorSound();

			// 오버레이 및 지진 효과 활성화
			scaryOverlay.classList.add('active');
			scaryOverlay.setAttribute('aria-hidden', 'false');
			document.body.classList.add('earthquake');

			// 2.5초 후 자동 종료
			jumpscareTimeout = setTimeout(closeJumpscare, 2500);
		}

		function closeJumpscare() {
			if (jumpscareTimeout) {
				clearTimeout(jumpscareTimeout);
				jumpscareTimeout = null;
			}
			scaryOverlay.classList.remove('active');
			scaryOverlay.setAttribute('aria-hidden', 'true');
			document.body.classList.remove('earthquake');
		}

		scaryBtn.addEventListener('click', function(e) {
			e.preventDefault();
			triggerJumpscare();
		});

		scaryOverlay.addEventListener('click', function() {
			closeJumpscare();
		});

		document.addEventListener('keydown', function(e) {
			if (e.key === 'Escape' && scaryOverlay.classList.contains('active')) {
				closeJumpscare();
			}
		});
	});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>주간보고서</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/css/weekly-report.css?v=5">
</head>
<body>
<main class="report-page">
	<header class="report-toolbar">
		<div class="toolbar-title">
			<h1>주간보고서</h1>
			<span>개발팀 주간회의 보고서</span>
		</div>
		<nav class="toolbar-actions" aria-label="화면 이동">
			<span style="font-size:14px; color:#475569; margin-right:8px;"><strong sec:authentication="principal.name">홍길동</strong> 님</span>
			<a class="secondary-link" href="/calendar">캘린더</a>
			<button class="secondary-link" id="excelDownloadButton" type="button" style="border-color: #f97316; color: #f97316; font-weight: 700;">엑셀 다운로드</button>
			<button class="primary-button" id="loadPreviewButton" type="button">자동 정리</button>
			<form th:action="@{/logout}" method="post" style="display:inline-block; margin:0;">
				<button class="secondary-link" type="submit" style="background:transparent; cursor:pointer;">로그아웃</button>
			</form>
		</nav>
	</header>

	<section class="report-meta" aria-label="보고서 기본 정보">
		<label class="field">
			<span>작성일자</span>
			<input id="reportDate" type="date">
		</label>
		<label class="field">
			<span>작성자</span>
			<input id="writer" type="text" th:value="${#authentication.principal.name}">
		</label>
		<label class="field">
			<span>금주 시작</span>
			<input id="weekStart" type="date">
		</label>
		<label class="field">
			<span>금주 종료</span>
			<input id="weekEnd" type="date">
		</label>
		<label class="field">
			<span>차주 시작</span>
			<input id="nextWeekStart" type="date">
		</label>
		<label class="field">
			<span>차주 종료</span>
			<input id="nextWeekEnd" type="date">
		</label>
	</section>

	<section class="workspace">
		<aside class="work-log-panel" aria-label="캘린더 기록 후보">
			<div class="section-title">
				<h2>캘린더 기록</h2>
				<select aria-label="후보 필터">
					<option>전체</option>
					<option>금주</option>
					<option>차주</option>
					<option>보고서 포함</option>
				</select>
			</div>

			<div class="candidate-list" id="candidateList">
				<p class="empty-message">자동 정리를 실행하면 캘린더 기록이 표시됩니다.</p>
			</div>
		</aside>

		<section class="report-editor" aria-label="보고서 작성">
			<section class="report-section">
				<div class="section-title">
					<h2>1. 업무 수명사항</h2>
					<button class="line-button" type="button">행 추가</button>
				</div>
				<div class="table-wrap">
					<table>
						<thead>
						<tr>
							<th>NO</th>
							<th>업무 수명사항</th>
							<th>지시일</th>
							<th>완료예정일</th>
							<th>완료일</th>
							<th>담당자</th>
							<th>진행상태</th>
							<th>비고</th>
						</tr>
						</thead>
						<tbody id="instructionTableBody">
						<tr>
							<td>1</td>
							<td><input type="text"></td>
							<td><input type="date"></td>
							<td><input type="date"></td>
							<td><input type="date"></td>
							<td><input type="text"></td>
							<td>
								<select>
									<option>진행중</option>
									<option>완료</option>
									<option>지연</option>
								</select>
							</td>
							<td><input type="text"></td>
						</tr>
						</tbody>
					</table>
				</div>
			</section>

			<section class="report-section">
				<div class="section-title">
					<h2>2. 개발부 실적 및 계획</h2>
					<button class="line-button" type="button">정리</button>
				</div>
				<div class="performance-grid">
					<div class="performance-row">
						<div class="work-type">프로젝트 일반</div>
						<textarea data-work-type="프로젝트 일반" data-column="thisWeek"></textarea>
						<textarea data-work-type="프로젝트 일반" data-column="nextWeek"></textarea>
					</div>
					<div class="performance-row">
						<div class="work-type">프로젝트 지원협조</div>
						<textarea data-work-type="프로젝트 지원협조" data-column="thisWeek"></textarea>
						<textarea data-work-type="프로젝트 지원협조" data-column="nextWeek"></textarea>
					</div>
					<div class="performance-row">
						<div class="work-type">유지보수</div>
						<textarea data-work-type="유지보수" data-column="thisWeek"></textarea>
						<textarea data-work-type="유지보수" data-column="nextWeek"></textarea>
					</div>
					<div class="performance-row">
						<div class="work-type">일반업무</div>
						<textarea data-work-type="일반업무" data-column="thisWeek"></textarea>
						<textarea data-work-type="일반업무" data-column="nextWeek"></textarea>
					</div>
					<div class="performance-row">
						<div class="work-type">공유</div>
						<textarea data-work-type="공유" data-column="thisWeek"></textarea>
						<textarea data-work-type="공유" data-column="nextWeek"></textarea>
					</div>
				</div>
			</section>

			<section class="report-section">
				<div class="section-title">
					<h2>3. 프로젝트 진행현황</h2>
					<button class="line-button" type="button">행 추가</button>
				</div>
				<div class="table-wrap">
					<table>
						<thead>
						<tr>
							<th>NO</th>
							<th>프로젝트</th>
							<th>착수</th>
							<th>분석</th>
							<th>설계</th>
							<th>개발</th>
							<th>테스트</th>
							<th>안정화</th>
							<th>진행상태</th>
						</tr>
						</thead>
						<tbody id="progressTableBody">
						<tr>
							<td>1</td>
							<td><input type="text" value="비에스"></td>
							<td><input type="number" min="0" max="100"></td>
							<td><input type="number" min="0" max="100"></td>
							<td><input type="number" min="0" max="100"></td>
							<td><input type="number" min="0" max="100" value="100"></td>
							<td><input type="number" min="0" max="100" value="100"></td>
							<td><input type="number" min="0" max="100" value="70"></td>
							<td>
								<select>
									<option>달성</option>
									<option>진행중</option>
									<option>지연</option>
								</select>
							</td>
						</tr>
						</tbody>
					</table>
				</div>
			</section>

			<section class="report-section">
				<div class="section-title">
					<h2>4. 지연프로젝트</h2>
					<button class="line-button" type="button">행 추가</button>
				</div>
				<div class="table-wrap">
					<table>
						<thead>
						<tr>
							<th>NO</th>
							<th>프로젝트</th>
							<th>구분</th>
							<th>이슈내용</th>
							<th>Gap 극복방안</th>
						</tr>
						</thead>
						<tbody id="delayTableBody">
						<tr>
							<td>1</td>
							<td><input type="text"></td>
							<td><input type="text"></td>
							<td><input type="text"></td>
							<td><input type="text"></td>
						</tr>
						</tbody>
					</table>
				</div>
			</section>
		</section>
	</section>
</main>
<script>
	document.addEventListener('DOMContentLoaded', function () {
		const reportDateInput = document.getElementById('reportDate');
		const writerInput = document.getElementById('writer');
		const weekStartInput = document.getElementById('weekStart');
		const weekEndInput = document.getElementById('weekEnd');
		const nextWeekStartInput = document.getElementById('nextWeekStart');
		const nextWeekEndInput = document.getElementById('nextWeekEnd');
		const loadPreviewButton = document.getElementById('loadPreviewButton');
		const excelDownloadButton = document.getElementById('excelDownloadButton');
		const candidateList = document.getElementById('candidateList');
		let loadedCandidates = [];

		setDefaultDates();
		loadPreviewButton.addEventListener('click', loadWeeklyPreview);
		excelDownloadButton.addEventListener('click', downloadExcel);

		loadWeeklyPreview();

		function downloadExcel() {
			const request = {
				reportDate: reportDateInput.value,
				writer: writerInput.value.trim(),
				weekStart: weekStartInput.value,
				weekEnd: weekEndInput.value,
				nextWeekStart: nextWeekStartInput.value,
				nextWeekEnd: nextWeekEndInput.value,
				instructions: [],
				performances: [],
				progresses: [],
				delays: []
			};

			// 1. 업무 수명사항 수집
			document.querySelectorAll('#instructionTableBody tr').forEach(tr => {
				const cells = tr.querySelectorAll('td');
				if (cells.length < 8) return;
				const no = parseInt(cells[0].textContent.trim());
				const content = cells[1].querySelector('input').value.trim();
				const directedDate = cells[2].querySelector('input').value;
				const dueDate = cells[3].querySelector('input').value;
				const completeDate = cells[4].querySelector('input').value;
				const assignee = cells[5].querySelector('input').value.trim();
				const status = cells[6].querySelector('select').value;
				const note = cells[7].querySelector('input').value.trim();

				if (!content && !directedDate && !dueDate && !completeDate && !assignee && !note) {
					return;
				}

				request.instructions.push({ no, content, directedDate, dueDate, completeDate, assignee, status, note });
			});

			// 2. 개발부 실적 및 계획 수집
			document.querySelectorAll('.performance-row').forEach(row => {
				const workType = row.querySelector('.work-type').textContent.trim();
				const thisWeek = row.querySelector('textarea[data-column="thisWeek"]').value.trim();
				const nextWeek = row.querySelector('textarea[data-column="nextWeek"]').value.trim();
				request.performances.push({ workType, thisWeek, nextWeek });
			});

			// 3. 프로젝트 진행현황 수집
			document.querySelectorAll('#progressTableBody tr').forEach(tr => {
				const cells = tr.querySelectorAll('td');
				if (cells.length < 9) return;
				const no = parseInt(cells[0].textContent.trim());
				const projectName = cells[1].querySelector('input').value.trim();
				const startRate = cells[2].querySelector('input').value ? parseInt(cells[2].querySelector('input').value) : null;
				const analysisRate = cells[3].querySelector('input').value ? parseInt(cells[3].querySelector('input').value) : null;
				const designRate = cells[4].querySelector('input').value ? parseInt(cells[4].querySelector('input').value) : null;
				const developRate = cells[5].querySelector('input').value ? parseInt(cells[5].querySelector('input').value) : null;
				const testRate = cells[6].querySelector('input').value ? parseInt(cells[6].querySelector('input').value) : null;
				const stabilizationRate = cells[7].querySelector('input').value ? parseInt(cells[7].querySelector('input').value) : null;
				const status = cells[8].querySelector('select').value;

				if (!projectName && startRate === null && analysisRate === null && designRate === null && developRate === null && testRate === null && stabilizationRate === null) {
					return;
				}

				request.progresses.push({ no, projectName, startRate, analysisRate, designRate, developRate, testRate, stabilizationRate, status });
			});

			// 4. 지연 프로젝트 수집
			document.querySelectorAll('#delayTableBody tr').forEach(tr => {
				const cells = tr.querySelectorAll('td');
				if (cells.length < 5) return;
				const no = parseInt(cells[0].textContent.trim());
				const projectName = cells[1].querySelector('input').value.trim();
				const category = cells[2].querySelector('input').value.trim();
				const issueContent = cells[3].querySelector('input').value.trim();
				const recoveryPlan = cells[4].querySelector('input').value.trim();

				if (!projectName && !category && !issueContent && !recoveryPlan) {
					return;
				}

				request.delays.push({ no, projectName, category, issueContent, recoveryPlan });
			});

			excelDownloadButton.disabled = true;
			excelDownloadButton.textContent = '다운로드 중...';

			fetch('/api/reports/weekly/download', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(request)
			})
			.then(response => {
				if (!response.ok) {
					throw new Error('엑셀 다운로드 처리 실패');
				}
				return response.blob();
			})
			.then(blob => {
				const url = window.URL.createObjectURL(blob);
				const a = document.createElement('a');
				a.href = url;
				const rawDate = request.reportDate ? request.reportDate : new Date().toISOString().slice(0, 10);
				const dateStr = rawDate.replace(/-/g, '');
				a.download = `${dateStr}_개발팀_주간혁신회의_${request.writer}.xlsx`;
				document.body.appendChild(a);
				a.click();
				a.remove();
				window.URL.revokeObjectURL(url);
			})
			.catch(err => {
				console.error(err);
				alert('엑셀 파일 생성 중 오류가 발생했습니다.');
			})
			.finally(() => {
				excelDownloadButton.disabled = false;
				excelDownloadButton.textContent = '엑셀 다운로드';
			});
		}

		function setDefaultDates() {
			const today = new Date();
			const monday = getMonday(today);
			const friday = addDays(monday, 4);
			const nextMonday = addDays(monday, 7);
			const nextFriday = addDays(nextMonday, 4);

			reportDateInput.value = toDateValue(today);
			weekStartInput.value = toDateValue(monday);
			weekEndInput.value = toDateValue(friday);
			nextWeekStartInput.value = toDateValue(nextMonday);
			nextWeekEndInput.value = toDateValue(nextFriday);
		}

		function loadWeeklyPreview() {
			const params = new URLSearchParams({
				weekStart: weekStartInput.value,
				weekEnd: weekEndInput.value,
				nextWeekStart: nextWeekStartInput.value,
				nextWeekEnd: nextWeekEndInput.value
			});

			fetch(`/api/reports/weekly/preview?${params}`)
				.then(function (response) {
					if (!response.ok) {
						throw new Error('주간보고서 자동 정리에 실패했습니다.');
					}

					return response.json();
				})
				.then(function (preview) {
					loadedCandidates = preview.candidates;
					renderCandidates(preview.candidates);
					renderSelectedRows();
				});
		}

		function renderCandidates(candidates) {
			candidateList.innerHTML = '';

			if (candidates.length === 0) {
				candidateList.innerHTML = '<p class="empty-message">선택한 기간에 보고서 포함 기록이 없습니다.</p>';
				return;
			}

			for (const candidate of candidates) {
				const item = document.createElement('div');
				item.className = 'candidate-item';
				item.dataset.candidateId = candidate.id;
				item.innerHTML = `
					<input type="checkbox" data-work-log-id="${candidate.id}" checked>
					<span class="candidate-content">
						<span class="candidate-title-wrap">
							<strong class="candidate-title" data-id="${candidate.id}">${escapeHtml(candidate.title)}</strong>
							<button type="button" class="title-edit-btn" data-id="${candidate.id}" title="제목 수정">✏</button>
						</span>
						<small>${formatCandidateMeta(candidate)}</small>
					</span>
				`;
				candidateList.appendChild(item);
			}

			for (const checkbox of candidateList.querySelectorAll('[data-work-log-id]')) {
				checkbox.addEventListener('change', renderSelectedRows);
			}

			for (const editBtn of candidateList.querySelectorAll('.title-edit-btn')) {
				editBtn.addEventListener('click', function (e) {
					e.stopPropagation();
					const id = Number(this.dataset.id);
					const titleEl = candidateList.querySelector(`.candidate-title[data-id="${id}"]`);
					const candidate = loadedCandidates.find(c => c.id === id);
					if (!titleEl || !candidate || titleEl.dataset.editing === 'true') return;

					titleEl.dataset.editing = 'true';
					const originalTitle = candidate.title;
					const input = document.createElement('input');
					input.type = 'text';
					input.value = originalTitle;
					input.className = 'candidate-title-input';

					function saveTitle() {
						const newTitle = input.value.trim() || originalTitle;
						candidate.title = newTitle;
						titleEl.textContent = newTitle;
						delete titleEl.dataset.editing;
						input.replaceWith(titleEl);
						renderSelectedRows();
					}

					input.addEventListener('blur', saveTitle);
					input.addEventListener('keydown', function (e) {
						if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
						if (e.key === 'Escape') { input.value = originalTitle; this.blur(); }
					});

					titleEl.replaceWith(input);
					input.focus();
					input.select();
				});
			}
		}

		function renderSelectedRows() {
			const selectedIds = new Set(
				Array.from(candidateList.querySelectorAll('[data-work-log-id]:checked'))
					.map(function (checkbox) {
						return Number(checkbox.dataset.workLogId);
					})
			);
			const selectedCandidates = loadedCandidates.filter(function (candidate) {
				return selectedIds.has(candidate.id);
			});
			const rows = buildRows(selectedCandidates);

			for (const textarea of document.querySelectorAll('[data-work-type][data-column]')) {
				textarea.value = '';
			}

			for (const row of rows) {
				const thisWeekTextarea = document.querySelector(`[data-work-type="${row.workType}"][data-column="thisWeek"]`);
				const nextWeekTextarea = document.querySelector(`[data-work-type="${row.workType}"][data-column="nextWeek"]`);

				if (thisWeekTextarea) {
					thisWeekTextarea.value = row.thisWeek || '';
				}

				if (nextWeekTextarea) {
					nextWeekTextarea.value = row.nextWeek || '';
				}
			}
		}

		function buildRows(candidates) {
			const workTypes = ['프로젝트 일반', '프로젝트 지원협조', '유지보수', '일반업무', '공유'];

			return workTypes.map(function (workType) {
				return {
					workType: workType,
					thisWeek: buildReportText(candidates, workType, 'thisWeek'),
					nextWeek: buildReportText(candidates, workType, 'nextWeek')
				};
			});
		}

		function buildReportText(candidates, workType, column) {
			const grouped = new Map();

			for (const candidate of candidates) {
				if (toWorkType(candidate.category) !== workType || toReportColumn(candidate) !== column) {
					continue;
				}

				const projectName = candidate.projectName || '공통';

				if (!grouped.has(projectName)) {
					grouped.set(projectName, []);
				}

				grouped.get(projectName).push(candidate);
			}

			const blocks = [];
			let projectNumber = 1;

			for (const [projectName, workLogs] of grouped.entries()) {
				const lines = [`${projectNumber}. ${projectName}`];

				for (const workLog of workLogs) {
					lines.push(`- ${formatReportLine(workLog, column)}`);
				}

				blocks.push(lines.join('\n'));
				projectNumber++;
			}

			return blocks.join('\n\n');
		}

		function formatReportLine(candidate, column) {
			const displayType = candidate.reportDisplayType || 'PROGRESS';

			if (displayType === 'VISIT_DATE') {
				return `${candidate.title}(${formatShortDate(candidate.start)})`;
			}

			if (displayType === 'DONE_STATUS') {
				return `${candidate.title} (${candidate.status || '완료'})`;
			}

			if (displayType === 'DUE_DATE') {
				return `${candidate.title} (~${formatShortDate(candidate.end)})`;
			}

			if (displayType === 'NONE') {
				return candidate.title;
			}

			if (candidate.status === '완료' || candidate.progressRate === 100) {
				return `${candidate.title} (완료)`;
			}

			if (candidate.progressRate !== null) {
				return `${candidate.title} (${candidate.progressRate}%)`;
			}

			if (column === 'nextWeek') {
				return `${candidate.title} (~${formatShortDate(candidate.end)})`;
			}

			return candidate.title;
		}

		function toWorkType(category) {
			if (category === '개발' || category === '문서') {
				return '프로젝트 일반';
			}

			if (category === '지원') {
				return '프로젝트 지원협조';
			}

			if (category === '유지보수') {
				return '유지보수';
			}

			if (category === '공유') {
				return '공유';
			}

			return '일반업무';
		}

		function toReportColumn(candidate) {
			const workDate = candidate.start.slice(0, 10);

			if (workDate >= nextWeekStartInput.value && workDate <= nextWeekEndInput.value) {
				return 'nextWeek';
			}

			return 'thisWeek';
		}

		function formatCandidateMeta(candidate) {
			const date = candidate.start.slice(0, 10);
			const projectName = candidate.projectName || '공통';
			const category = candidate.category || '기타';
			const progress = candidate.progressRate === null ? '' : ` · ${candidate.progressRate}%`;

			return `${date} · ${escapeHtml(projectName)} · ${escapeHtml(category)}${progress}`;
		}

		function getMonday(date) {
			const nextDate = new Date(date);
			const day = nextDate.getDay() || 7;
			nextDate.setDate(nextDate.getDate() - day + 1);
			return nextDate;
		}

		function addDays(date, days) {
			const nextDate = new Date(date);
			nextDate.setDate(nextDate.getDate() + days);
			return nextDate;
		}

		function toDateValue(date) {
			const year = date.getFullYear();
			const month = String(date.getMonth() + 1).padStart(2, '0');
			const day = String(date.getDate()).padStart(2, '0');

			return `${year}-${month}-${day}`;
		}

		function formatShortDate(value) {
			const date = new Date(value);

			return `${date.getMonth() + 1}/${date.getDate()}`;
		}

		function escapeHtml(value) {
			return String(value ?? '')
				.replaceAll('&', '&amp;')
				.replaceAll('<', '&lt;')
				.replaceAll('>', '&gt;')
				.replaceAll('"', '&quot;')
				.replaceAll("'", '&#039;');
		}
	});
</script>

<!-- 무서운 깜짝 모달 (Jumpscare) -->
<div id="scaryJumpscareOverlay" class="scary-overlay" aria-hidden="true">

<button id="scaryJumpscareBtn" class="scary-button" type="button" aria-label="도움말">?</button>

<style>
	/* 반짝반짝 효과 물음표 버튼 */
	.scary-button {
		position: fixed;
		bottom: 20px;
		right: 20px;
		width: 42px;
		height: 42px;
		border-radius: 50%;
		background: radial-gradient(circle, #ff3333 0%, #660000 100%);

	.scary-button:hover {
		transform: scale(1.2) rotate(15deg);
		background: radial-gradient(circle, #ff0000 0%, #990000 100%);
		border-color: #ffcccc;
		box-shadow: 0 0 25px #ff0000, 0 0 50px #ff0000, inset 0 0 15px #ff6666;
		animation: crazy-vibrate 0.05s infinite;
	}

	@keyframes scary-blink {
		0% {
			box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, inset 0 0 5px #ff3333;
			opacity: 0.9;
			transform: scale(1);
		}
		50% {
			opacity: 1;
		}
		100% {
			box-shadow: 0 0 25px #ff3333, 0 0 45px #ff0000, 0 0 60px #ff0000, inset 0 0 15px #ff6666;
			opacity: 0.95;
			transform: scale(1.08);
		}
	}

	@keyframes crazy-vibrate {
		0% { transform: scale(1.2) translate(0, 0) rotate(15deg); }
		25% { transform: scale(1.2) translate(-2px, 2px) rotate(13deg); }
		50% { transform: scale(1.2) translate(2px, -2px) rotate(17deg); }
		75% { transform: scale(1.2) translate(-2px, -2px) rotate(14deg); }
		100% { transform: scale(1.2) translate(2px, 2px) rotate(16deg); }
	}

	/* 무서운 오버레이 화면 */
	.scary-overlay {
		display: none;
		position: fixed;
		top: 0;
		left: 0;
		width: 100vw;
		height: 100vh;
		background-color: rgba(0, 0, 0, 0.95);
		z-index: 100000;
		justify-content: center;
		align-items: center;
		overflow: hidden;
		backdrop-filter: blur(15px);
		animation: red-flash 0.2s infinite alternate;
	}

	.scary-overlay.active {
		display: flex;
	}

	.scary-content {
		position: relative;
		width: 100%;
		height: 100%;
		display: flex;
		justify-content: center;
		align-items: center;
	}

	.scary-image {
		max-width: 90%;
		max-height: 90%;
		object-fit: contain;
		transform: scale(0.1);
		opacity: 0;
		transition: transform 0.15s cubic-bezier(0.6, -0.28, 0.735, 0.045), opacity 0.1s ease-out;
	}

	.scary-overlay.active .scary-image {
		transform: scale(1.8);
		opacity: 1;
		animation: image-shake 0.05s infinite, image-zoom 2.5s forwards;
	}

	/* 화면 전체 흔들림 (지진 효과) */
	.earthquake {
		animation: screen-shake 0.08s infinite;
		overflow: hidden;
	}

	@keyframes red-flash {
		0% { background-color: rgba(0, 0, 0, 0.96); }
		100% { background-color: rgba(40, 0, 0, 0.98); }
	}

	@keyframes screen-shake {
		0% { transform: translate(0, 0) rotate(0deg); }
		20% { transform: translate(-8px, 10px) rotate(-1deg); }
		40% { transform: translate(9px, -9px) rotate(1deg); }
		60% { transform: translate(-10px, -7px) rotate(-1.5deg); }
		80% { transform: translate(8px, 8px) rotate(1deg); }
		100% { transform: translate(0, 0) rotate(0deg); }
	}

	@keyframes image-shake {
		0% { transform: scale(1.8) translate(0, 0); }
		25% { transform: scale(1.82) translate(-5px, 5px); }
		50% { transform: scale(1.78) translate(5px, -5px); }
		75% { transform: scale(1.83) translate(-5px, -5px); }
		100% { transform: scale(1.8) translate(5px, 5px); }
	}

	@keyframes image-zoom {
		0% { transform: scale(1.5); }
		100% { transform: scale(2.5); }
	}
</style>

<script>
	document.addEventListener('DOMContentLoaded', function() {
		const scaryBtn = document.getElementById('scaryJumpscareBtn');
		const scaryOverlay = document.getElementById('scaryJumpscareOverlay');
		let scaryAudioCtx = null;

		function playTerrorSound() {
			try {
				if (!scaryAudioCtx) {
					scaryAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
				}
				if (scaryAudioCtx.state === 'suspended') {
					scaryAudioCtx.resume();
				}

				const duration = 2.5;
				const dest = scaryAudioCtx.destination;

				// 1. 디스토션 노드 생성
				const distortion = scaryAudioCtx.createWaveShaper();
				distortion.curve = (function(amount) {
					const k = typeof amount === 'number' ? amount : 50;
					const n_samples = 44100;
					const curve = new Float32Array(n_samples);
					const deg = Math.PI / 180;
					for (let i = 0; i < n_samples; ++i) {
						const x = (i * 2) / n_samples - 1;
						curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
					}
					return curve;
				})(100);

				// 2. 게인 노드 (볼륨 페이드 아웃)
				const gainNode = scaryAudioCtx.createGain();
				gainNode.gain.setValueAtTime(0.01, scaryAudioCtx.currentTime);
				gainNode.gain.exponentialRampToValueAtTime(1.0, scaryAudioCtx.currentTime + 0.05);
				gainNode.gain.exponentialRampToValueAtTime(0.8, scaryAudioCtx.currentTime + 0.5);
				gainNode.gain.exponentialRampToValueAtTime(0.01, scaryAudioCtx.currentTime + duration - 0.1);

				// 3. 필터 노드 (기괴한 울림)
				const filter = scaryAudioCtx.createBiquadFilter();
				filter.type = 'peaking';
				filter.frequency.setValueAtTime(1000, scaryAudioCtx.currentTime);
				filter.Q.setValueAtTime(10, scaryAudioCtx.currentTime);

				// 4. 발진기 3개 (불협화음)
				const osc1 = scaryAudioCtx.createOscillator();
				osc1.type = 'sawtooth';
				osc1.frequency.setValueAtTime(180, scaryAudioCtx.currentTime);
				osc1.frequency.exponentialRampToValueAtTime(800, scaryAudioCtx.currentTime + 0.2);
				osc1.frequency.linearRampToValueAtTime(150, scaryAudioCtx.currentTime + duration);

				const osc2 = scaryAudioCtx.createOscillator();
				osc2.type = 'square';
				osc2.frequency.setValueAtTime(185, scaryAudioCtx.currentTime);
				osc2.frequency.exponentialRampToValueAtTime(850, scaryAudioCtx.currentTime + 0.25);
				osc2.frequency.linearRampToValueAtTime(90, scaryAudioCtx.currentTime + duration);

				const osc3 = scaryAudioCtx.createOscillator();
				osc3.type = 'triangle';
				osc3.frequency.setValueAtTime(90, scaryAudioCtx.currentTime);
				osc3.frequency.exponentialRampToValueAtTime(1200, scaryAudioCtx.currentTime + 0.1);
				osc3.frequency.linearRampToValueAtTime(40, scaryAudioCtx.currentTime + duration);

				// 5. 노이즈 소스 (귀를 긁는 소리)
				const bufferSize = scaryAudioCtx.sampleRate * duration;
				const buffer = scaryAudioCtx.createBuffer(1, bufferSize, scaryAudioCtx.sampleRate);
				const data = buffer.getChannelData(0);
				for (let i = 0; i < bufferSize; i++) {
					data[i] = Math.random() * 2 - 1;
				}
				const noise = scaryAudioCtx.createBufferSource();
				noise.buffer = buffer;

				const noiseFilter = scaryAudioCtx.createBiquadFilter();
				noiseFilter.type = 'bandpass';
				noiseFilter.frequency.setValueAtTime(1500, scaryAudioCtx.currentTime);
				noiseFilter.Q.setValueAtTime(2.0, scaryAudioCtx.currentTime);

				// 연결
				osc1.connect(distortion);
				osc2.connect(distortion);
				osc3.connect(distortion);
				distortion.connect(filter);
				filter.connect(gainNode);

				noise.connect(noiseFilter);
				noiseFilter.connect(gainNode);

				gainNode.connect(dest);

				// 재생 시작
				const now = scaryAudioCtx.currentTime;
				osc1.start(now);
				osc2.start(now);
				osc3.start(now);
				noise.start(now);

				// 정지
				osc1.stop(now + duration);
				osc2.stop(now + duration);
				osc3.stop(now + duration);
				noise.stop(now + duration);

			} catch (err) {
				console.error('사운드 생성 실패:', err);
			}
		}

		let jumpscareTimeout = null;

		function triggerJumpscare() {
			if (scaryOverlay.classList.contains('active')) return;

			playTerrorSound();

			// 오버레이 및 지진 효과 활성화
			scaryOverlay.classList.add('active');
			scaryOverlay.setAttribute('aria-hidden', 'false');
			document.body.classList.add('earthquake');

			// 2.5초 후 자동 종료
			jumpscareTimeout = setTimeout(closeJumpscare, 2500);
		}

		function closeJumpscare() {
			if (jumpscareTimeout) {
				clearTimeout(jumpscareTimeout);
				jumpscareTimeout = null;
			}
			scaryOverlay.classList.remove('active');
			scaryOverlay.setAttribute('aria-hidden', 'true');
			document.body.classList.remove('earthquake');
		}

		scaryBtn.addEventListener('click', function(e) {
			e.preventDefault();
			triggerJumpscare();
		});

		scaryOverlay.addEventListener('click', function() {
			closeJumpscare();
		});

		document.addEventListener('keydown', function(e) {
			if (e.key === 'Escape' && scaryOverlay.classList.contains('active')) {
				closeJumpscare();
			}
		});
	});
</script>
